<!doctype html>
<html lang="en" data-appearance="dark" data-theme="obsidian">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18181b">
  <meta name="description" content="Read and share Markdown in the browser.">
  <title>mdweb</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <button id="outline-toggle" class="icon-button" aria-label="Toggle outline" aria-expanded="false" title="Outline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <a href="/" class="wordmark">mdweb</a>
      <span class="brand-sep" aria-hidden="true">/</span>
      <span id="document-name"></span>
    </div>
    <div class="actions">
      <button id="edit-toggle" class="icon-button" aria-label="Edit source" aria-pressed="false" title="Edit source"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button id="appearance" class="icon-button" aria-label="Switch to light appearance" title="Toggle appearance"><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <button id="more" class="icon-button" popovertarget="menu" aria-label="More options" title="More"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      <button id="share" class="share-button">Share</button>
    </div>
  </header>
  <div id="menu" popover class="menu" aria-label="More options">
    <button id="open-file" class="menu-item">Open file…</button>
    <button id="download" class="menu-item">Download Markdown</button>
    <button id="print" class="menu-item">Print or save as PDF</button>
    <hr>
    <div class="menu-row"><label for="theme">Style</label><select id="theme"><option value="obsidian">Default</option><option value="paper">Paper</option><option value="midnight">Midnight</option></select></div>
    <div class="menu-row"><span>Text size</span><span class="stepper"><button id="smaller" aria-label="Smaller text">−</button><button id="larger" aria-label="Larger text">+</button></span></div>
    <hr>
    <a class="menu-item" href="https://github.com/lmdevv/mdweb" target="_blank" rel="noopener noreferrer">Source on GitHub</a>
  </div>
  <div class="workspace">
    <aside id="sidebar" aria-label="Document outline">
      <div class="sidebar-label">On this page</div>
      <nav id="outline" aria-label="Headings"></nav>
    </aside>
    <main id="main"><div id="error" role="alert" hidden></div><article id="document" class="markdown" aria-label="Markdown document"></article></main>
    <section id="editor" hidden aria-label="Markdown editor"><div class="editor-header"><label for="source">Source</label><button id="apply" class="primary">Apply</button></div><textarea id="source" spellcheck="false" aria-label="Markdown source"></textarea></section>
  </div>
  <div id="selection-actions" hidden role="group" aria-label="Share selected text"><button id="share-passage">Share passage</button><button id="share-context">Share in context</button></div>
  <dialog id="share-dialog" aria-labelledby="share-title"><button id="close-share" class="close icon-button" aria-label="Close share dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><h2 id="share-title">Share this document</h2><p id="share-description">A snapshot of your document and reading theme.</p><div id="qr-container"><canvas id="qr" aria-label="Document QR code"></canvas><p id="qr-message" hidden></p></div><div class="share-url"><label class="sr-only" for="share-url">Share link</label><input id="share-url" readonly><button id="copy-link" class="primary">Copy link</button></div><div class="share-extra"><button id="native-share" hidden>Share with an app</button><button id="save-qr">Download QR</button></div><p class="share-note">Anyone with the full link can read this snapshot.</p></dialog>
  <input id="file-input" type="file" accept=".md,.markdown,.mkd,.txt,text/markdown,text/plain" hidden>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
